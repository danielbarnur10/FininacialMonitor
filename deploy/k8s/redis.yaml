apiVersion: apps/v1
kind: Deployment

metadata:
  name: financial-monitor-redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: financial-monitor-redis

  template:
    metadata:
      labels:
        app: financial-monitor-redis

    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine

          ports:
            - name: redis
              containerPort: 6379

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5

---
apiVersion: v1
kind: Service

metadata:
  name: financial-monitor-redis

spec:
  type: ClusterIP

  selector:
    app: financial-monitor-redis

  ports:
    - name: redis
      port: 6379
      targetPort: redis