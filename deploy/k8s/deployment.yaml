apiVersion: apps/v1
kind: Deployment

metadata:
  name: financial-monitor

spec:
  replicas: 5

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: financial-monitor

  template:
    metadata:
      labels:
        app: financial-monitor

    spec:
      containers:
        - name: api
          image: financial-monitor-api:distributed-v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: ConnectionStrings__Redis
              value: "financial-monitor-redis:6379"
            - name: Cors__AllowedOrigins__0
              value: "http://localhost:5173"
            - name: Cors__AllowedOrigins__1
              value: "http://127.0.0.1:5173"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
